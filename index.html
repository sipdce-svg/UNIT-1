<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Operating System Fundamentals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout concept: a classroom module. Sticky top bar with controls, a chapter drawer on the left,
   one chapter at a time in the main column, big SVG figures sized for a projector. */
:root{
  --bg:#f4f7fb; --surface:#ffffff; --surface2:#eaf0f8; --fg:#13203a; --muted:#44546f; --line:#cfd9e8;
  --accent:#0a5ea8; --accent-ink:#ffffff; --accent-soft:#dcebfa; --good:#1f7a3a; --bad:#b3263e; --warn:#a85d00;
  --h1:#1d6fd8; --h1s:#dbe9fb; --h2:#0e8f83; --h2s:#d3f0ec; --h3:#c77a00; --h3s:#fdecc8;
  --h4:#c63a58; --h4s:#fbdde4; --h5:#6c4bc4; --h5s:#e6defa; --h6:#3a8f2f; --h6s:#dcf1d6;
  --shadow:0 1px 2px rgba(19,32,58,.08),0 6px 18px rgba(19,32,58,.06);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --fs:1; --hh:3.6rem;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1524; --surface:#152238; --surface2:#1c2d49; --fg:#e8eef8; --muted:#a8b6cd; --line:#2c3d5c;
    --accent:#6db3ff; --accent-ink:#06182e; --accent-soft:#1c3a5e; --good:#6fd188; --bad:#ff8aa0; --warn:#f0b04a;
    --h1:#5aa2ff; --h1s:#1b3354; --h2:#3cc6b8; --h2s:#123c3a; --h3:#f0b04a; --h3s:#43320f;
    --h4:#ff7b98; --h4s:#44202c; --h5:#a58cf0; --h5s:#2f2655; --h6:#7fd16f; --h6s:#1f3a1b;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1524; --surface:#152238; --surface2:#1c2d49; --fg:#e8eef8; --muted:#a8b6cd; --line:#2c3d5c;
  --accent:#6db3ff; --accent-ink:#06182e; --accent-soft:#1c3a5e; --good:#6fd188; --bad:#ff8aa0; --warn:#f0b04a;
  --h1:#5aa2ff; --h1s:#1b3354; --h2:#3cc6b8; --h2s:#123c3a; --h3:#f0b04a; --h3s:#43320f;
  --h4:#ff7b98; --h4s:#44202c; --h5:#a58cf0; --h5s:#2f2655; --h6:#7fd16f; --h6s:#1f3a1b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:calc(16px * var(--fs));scroll-behavior:smooth;scroll-padding-top:calc(var(--hh) + 1rem)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:1rem;line-height:1.6;margin:0}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0}
p{margin:0 0 .8em}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
code,kbd,pre{font-family:var(--f-mono);font-size:.9em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;height:var(--hh);display:flex;align-items:center;gap:.7rem;padding-inline:16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.1rem;white-space:nowrap}
.brand small{display:block;font-family:var(--f-body);font-weight:600;font-size:.7rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;min-width:2.4rem;height:2.4rem;padding:0 .5rem;border:1px solid var(--line);background:var(--surface);border-radius:.6rem;font-weight:700}
.iconbtn:hover{background:var(--accent-soft)}
#menuBtn{display:none}
.search{position:relative;flex:1;max-width:28rem;min-width:0;margin-left:auto}
.search input{width:100%;height:2.4rem;border:1px solid var(--line);border-radius:.6rem;padding:0 .8rem;background:var(--bg);color:var(--fg);font:inherit}
#results{position:absolute;top:2.9rem;left:0;right:0;max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:.7rem;box-shadow:var(--shadow);padding:.3rem;z-index:50}
#results button{display:block;width:100%;text-align:left;background:none;border:0;padding:.55rem .7rem;border-radius:.5rem}
#results button:hover,#results button:focus-visible{background:var(--accent-soft)}
#results b{display:block;font-family:var(--f-display)}
#results span{font-size:.85rem;color:var(--muted)}
.ctl{display:flex;gap:.4rem}
.pbar{position:absolute;left:0;right:0;bottom:-1px;height:4px;background:var(--line)}
.pbar i{display:block;height:100%;width:0;background:var(--h2);transition:width .5s}

/* layout */
.layout{display:grid;grid-template-columns:17rem minmax(0,1fr);gap:1.5rem;padding-inline:16px;max-width:90rem;margin:0 auto;align-items:start}
#side{position:sticky;top:calc(var(--hh) + env(safe-area-inset-top,0px) + .8rem);max-height:calc(100dvh - var(--hh) - 2rem);overflow:auto;padding-block:1rem;margin-top:.8rem}
.side-h{font-size:.8rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:.6rem}
.ptxt{display:block;font-size:.95rem;letter-spacing:0;text-transform:none;color:var(--fg);margin-top:.15rem}
#toc{list-style:none;margin:0;padding:0;display:grid;gap:.15rem}
#toc button{width:100%;display:flex;align-items:center;gap:.6rem;text-align:left;border:0;background:none;padding:.5rem .6rem;border-radius:.6rem;font-size:.95rem;line-height:1.25}
#toc button:hover{background:var(--surface2)}
#toc button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
#toc .n{flex:none;width:1.7rem;height:1.7rem;display:grid;place-items:center;border-radius:50%;border:1.5px solid var(--line);font-size:.78rem;font-weight:700;font-variant-numeric:tabular-nums}
#toc .seen .n{background:var(--h6s);border-color:var(--h6);color:var(--fg)}
#toc [aria-current="page"] .n{border-color:currentColor;background:transparent}
#scrim{display:none}
main{min-width:0;padding-block:1.4rem 3rem}
main:focus,main:focus-visible{outline:none}
.chapter{animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.ch-head{display:flex;flex-direction:column;gap:.5rem;margin-bottom:1.6rem}
.eyebrow{font-size:.8rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.ch-head h1{font-size:clamp(1.9rem,4vw,2.9rem);font-weight:800}
.ch-head p{font-size:1.15rem;color:var(--muted);max-width:52rem;margin:0}
h2.sec{font-size:clamp(1.4rem,2.6vw,1.9rem);font-weight:700;margin:2.4rem 0 1rem}
h3{font-size:1.3rem;font-weight:700}

/* generic components */
.card{background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:1.2rem 1.3rem;box-shadow:var(--shadow);min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,18rem),1fr));gap:1rem}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr));gap:1rem}
.stack{display:grid;gap:1rem}
.callout{border-radius:.9rem;padding:.9rem 1.1rem;background:var(--accent-soft);min-width:0}
.callout .lab,.lab{display:block;font-size:.75rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:.25rem}
.callout p:last-child{margin-bottom:0}
.callout.real{background:var(--h3s)}.callout.real .lab{color:var(--warn)}
.callout.comp{background:var(--h2s)}.callout.comp .lab{color:var(--h2)}
.callout.exam{background:var(--h5s)}.callout.exam .lab{color:var(--h5)}
.callout.warn{background:var(--h4s)}.callout.warn .lab{color:var(--h4)}
.callout.analogy{background:var(--h3s)}
ul.tick,ul.cross,ul.pts{margin:.2rem 0 0;padding:0;list-style:none;display:grid;gap:.35rem}
ul.tick li,ul.cross li,ul.pts li{position:relative;padding-left:1.5rem}
ul.tick li::before{content:"✓";position:absolute;left:0;color:var(--good);font-weight:800}
ul.cross li::before{content:"✗";position:absolute;left:0;color:var(--bad);font-weight:800}
ul.pts li::before{content:"";position:absolute;left:.25rem;top:.62em;width:.5rem;height:.5rem;border-radius:50%;background:var(--accent)}
.chip{display:inline-block;padding:.12rem .6rem;border-radius:2rem;background:var(--surface2);font-size:.82rem;font-weight:600;border:1px solid var(--line)}
.ico{flex:none;vertical-align:-.2em}
details{border:1px solid var(--line);border-radius:.8rem;background:var(--surface);margin-block:.6rem;overflow:hidden}
summary{cursor:pointer;padding:.75rem 1rem;font-weight:700;list-style:none;display:flex;align-items:center;gap:.6rem}
summary::-webkit-details-marker{display:none}
summary::before{content:"+";display:grid;place-items:center;width:1.4rem;height:1.4rem;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:800;flex:none;transition:transform .2s}
details[open]>summary::before{content:"–"}
details[open]>summary{border-bottom:1px solid var(--line);background:var(--surface2)}
details>div.dbody{padding:1rem 1.1rem}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:.9rem;background:var(--surface);box-shadow:var(--shadow)}
table.cmp{border-collapse:collapse;width:100%;min-width:34rem}
table.cmp th,table.cmp td{padding:.65rem .8rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
table.cmp thead th{background:var(--surface2);font-family:var(--f-display);position:sticky;top:0}
table.cmp tbody th{font-weight:700;background:color-mix(in srgb,var(--surface2) 50%,var(--surface));white-space:nowrap}
table.cmp tbody tr:hover td{background:var(--accent-soft)}
table.cmp tr:last-child td,table.cmp tr:last-child th{border-bottom:0}
.dots{display:inline-flex;gap:.2rem;vertical-align:middle;margin-right:.4rem}
.dots i{width:.7rem;height:.7rem;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--h2)}
.dots.low i.on{background:var(--h4)}
.btn{border:0;border-radius:.7rem;background:var(--accent);color:var(--accent-ink);padding:.6rem 1.1rem;font-weight:700}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}

/* figures and svg */
.fig{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:.8rem;box-shadow:var(--shadow);min-width:0;overflow-x:auto}
.fig svg{display:block;width:100%;height:auto;min-width:36rem;margin-inline:auto}
.fig.narrow svg{max-width:34rem}
.fig figcaption{font-size:.9rem;color:var(--muted);text-align:center;margin-top:.4rem}
svg text{fill:var(--fg);font-family:var(--f-body);font-size:15px}
svg .bold,svg .bx text{font-weight:700}
svg .sm{font-size:12.5px;font-weight:600}
svg .mut{fill:var(--muted)}
svg .ttl{font-family:var(--f-display);font-size:18px;font-weight:700}
.bx rect,.bx circle,.bx ellipse{stroke-width:2;transition:stroke-width .15s,filter .15s}
.b1 rect,.b1 circle,.b1 ellipse{fill:var(--h1s);stroke:var(--h1)}
.b2 rect,.b2 circle,.b2 ellipse{fill:var(--h2s);stroke:var(--h2)}
.b3 rect,.b3 circle,.b3 ellipse{fill:var(--h3s);stroke:var(--h3)}
.b4 rect,.b4 circle,.b4 ellipse{fill:var(--h4s);stroke:var(--h4)}
.b5 rect,.b5 circle,.b5 ellipse{fill:var(--h5s);stroke:var(--h5)}
.b6 rect,.b6 circle,.b6 ellipse{fill:var(--h6s);stroke:var(--h6)}
.b0 rect,.b0 circle,.b0 ellipse{fill:var(--surface2);stroke:var(--muted)}
.bx.click{cursor:pointer}
.bx.click:hover rect,.bx.click:hover circle,.bx.click:focus rect,.bx.click:focus circle{stroke-width:4}
.bx.active rect,.bx.active circle{stroke-width:5;filter:drop-shadow(0 3px 6px rgba(0,0,0,.28))}
.bx.dead rect{fill:var(--h4s);stroke:var(--h4);stroke-dasharray:6 4}
.bx.dim{opacity:.35}
.bx.lit rect{stroke-width:5;filter:drop-shadow(0 0 7px var(--h3))}
svg .ar{stroke:var(--muted);stroke-width:2.2;fill:none}
svg .arh{fill:var(--muted)}
svg .ln{stroke:var(--line);stroke-width:2;fill:none}
svg .dash{stroke-dasharray:6 5}
.infobox{margin-top:.8rem;min-height:4.2rem}
.infobox h4{font-size:1.1rem;margin-bottom:.2rem}
.flow-dot{animation:none}

/* tooltip */
.tip{border-bottom:2px dotted var(--accent);cursor:help;font-weight:600}
#tipbox{position:fixed;z-index:80;max-width:min(20rem,calc(100vw - 24px));background:var(--fg);color:var(--bg);padding:.55rem .75rem;border-radius:.6rem;font-size:.9rem;line-height:1.4;box-shadow:0 6px 24px rgba(0,0,0,.3);pointer-events:none}

/* concept card (the 10-point teaching pattern) */
.concept{display:grid;gap:1rem;margin-block:1rem}
.concept>header{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.concept>header h3{font-size:clamp(1.4rem,2.8vw,1.9rem)}
.badge{display:inline-grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:.7rem;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:800}
.concept h4.lab{margin:0 0 .3rem}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:1.6rem;align-items:center;padding:1.6rem;border-radius:1.4rem;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);background-image:radial-gradient(var(--line) 1px,transparent 1.2px);background-size:22px 22px}
.hero h1{font-size:clamp(2.2rem,6vw,4.2rem);font-weight:800;letter-spacing:-.02em;line-height:1}
.hero h1 span{color:var(--accent)}
.hero .kicker{font-family:var(--f-display);font-size:1.25rem;font-weight:600;margin:.8rem 0 .4rem}
.hero .sub{font-size:1.1rem;color:var(--muted);max-width:30rem}
.hero .cta{margin-top:1rem}
.hero .fig{background:var(--bg)}

/* chapter nav */
.chnav{display:flex;justify-content:space-between;gap:1rem;margin-top:3rem;padding-top:1.4rem;border-top:1px solid var(--line)}
.chnav button{display:flex;flex-direction:column;align-items:flex-start;gap:.1rem;max-width:48%;padding:.8rem 1.1rem;border-radius:.9rem;border:1px solid var(--line);background:var(--surface);text-align:left;box-shadow:var(--shadow)}
.chnav button:hover{background:var(--accent-soft)}
.chnav button.next{margin-left:auto;align-items:flex-end;text-align:right;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chnav button.next:hover{filter:brightness(1.1)}
.chnav small{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;opacity:.8;font-weight:700}
.chnav b{font-family:var(--f-display);font-size:1.05rem}
#toTop{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:3rem;height:3rem;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow);font-size:1.3rem;font-weight:800;opacity:0;pointer-events:none;transform:translateY(10px);transition:.25s;z-index:45}
#toTop.show{opacity:1;pointer-events:auto;transform:none}

/* simulators */
.sim{background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:1rem;box-shadow:var(--shadow);min-width:0}
.sim h4{font-size:1.1rem;margin-bottom:.5rem}
.sim input[type=range]{width:min(100%,20rem);accent-color:var(--accent)}
.seq{display:flex;flex-wrap:wrap;gap:3px;margin:.6rem 0}
.seq span{display:grid;place-items:center;height:2.2rem;border-radius:.4rem;font-weight:700;font-size:.85rem;color:#fff;min-width:1.2rem;padding-inline:.15rem}
.pA{background:var(--h1)}.pB{background:var(--h4)}.pC{background:var(--h6)}.pD{background:var(--h3)}
:root[data-theme="dark"] .seq span,:root:not([data-theme="light"]) .seq span{color:#0a1220}
.bar{height:1.1rem;border-radius:1rem;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--h2);transition:width .6s}
.stat{font-family:var(--f-display);font-weight:800;font-size:1.6rem;font-variant-numeric:tabular-nums}
.meter{display:flex;gap:1rem;flex-wrap:wrap}.meter>div{flex:1 1 9rem}

/* terminal */
.term{background:#0b1220;color:#d6e2f5;border-radius:.9rem;padding:1rem;font-family:var(--f-mono);font-size:.88rem;min-height:11rem;white-space:pre-wrap;overflow-x:auto;border:1px solid #223;line-height:1.5}
.term .pr{color:#7fd16f}.term .cm{color:#ffd479}
.cmds{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.7rem}
.cmds button{font-family:var(--f-mono);font-size:.88rem;border:1px solid var(--line);background:var(--surface);border-radius:.5rem;padding:.3rem .7rem}
.cmds button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* flashcards */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,16rem),1fr));gap:1rem}
.flip{perspective:900px;height:13.5rem;background:none;border:0;padding:0;text-align:left}
.flip .in{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.flip[aria-pressed="true"] .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:1rem;border:1px solid var(--line);padding:1rem;display:flex;flex-direction:column;justify-content:center;gap:.4rem;box-shadow:var(--shadow);overflow:auto}
.flip .f{background:var(--surface)}
.flip .f b{font-family:var(--f-display);font-size:1.15rem}
.flip .b{background:var(--accent);color:var(--accent-ink);transform:rotateY(180deg);font-size:.95rem;line-height:1.45}
.flip .hint{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}

/* quiz */
.qwrap{max-width:50rem}
.qopt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:.8rem;padding:.7rem 1rem;margin-top:.5rem;font-size:1.05rem}
.qopt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.qopt.right{border-color:var(--good);background:var(--h6s)}
.qopt.wrong{border-color:var(--bad);background:var(--h4s)}
.qopt:disabled{cursor:default}
.qnum{font-weight:700;color:var(--muted)}
.qq{font-family:var(--f-display);font-size:1.35rem;font-weight:700;margin:.3rem 0 .5rem}
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(8rem,1fr));gap:.8rem;margin:1rem 0}
.score div{background:var(--surface2);border-radius:.8rem;padding:.8rem;text-align:center}
.score b{display:block;font-family:var(--f-display);font-size:2rem;font-variant-numeric:tabular-nums}

/* mind map */
.mm{overflow-x:auto}
.mm svg{min-width:44rem}
.mm .node{cursor:pointer}
.mm .node rect,.mm .node ellipse{stroke-width:2.2}
.mm .node text{font-weight:700}
.mm .node:hover rect,.mm .node:focus rect,.mm .node:hover ellipse{stroke-width:4.5}
.mm .node.sel rect{stroke-width:5;filter:drop-shadow(0 0 8px var(--h3))}
.mm g.kid,.mm line.edge{transition:opacity .35s,transform .35s}
.mm .hidden{opacity:0;pointer-events:none}

/* glossary */
.gl input{width:100%;max-width:26rem;height:2.7rem;border:1px solid var(--line);border-radius:.7rem;padding:0 .9rem;background:var(--surface);color:var(--fg);font:inherit;margin-bottom:1rem}
.gterm{display:grid;grid-template-columns:minmax(8rem,12rem) minmax(0,1fr);gap:.8rem;padding:.7rem 0;border-bottom:1px solid var(--line)}
.gterm dt{font-family:var(--f-display);font-weight:700}
.gterm dd{margin:0}

.verify{display:flex;flex-wrap:wrap;gap:.6rem 1.4rem;align-items:center}
.verify .stat{font-size:1.4rem}

@media (max-width:60rem){
  .layout{grid-template-columns:minmax(0,1fr)}
  #menuBtn{display:inline-flex}
  #side{position:fixed;z-index:60;top:0;left:0;bottom:0;width:min(19rem,86vw);max-height:none;margin:0;padding:calc(1rem + env(safe-area-inset-top,0px)) 1rem 1rem;background:var(--surface);border-right:1px solid var(--line);transform:translateX(-105%);transition:transform .25s;box-shadow:var(--shadow)}
  #side.open{transform:none}
  #scrim.open{display:block;position:fixed;inset:0;z-index:55;background:rgba(5,10,20,.5)}
  .hero{grid-template-columns:minmax(0,1fr)}
  .brand small{display:none}
  .ctl .hide-s{display:none}
}
@media (max-width:34rem){
  .brand{display:none}
  .gterm{grid-template-columns:minmax(0,1fr);gap:.2rem}
  .chnav b{font-size:.95rem}
  .top{gap:.4rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
@media print{
  :root{--bg:#fff;--surface:#fff;--fg:#000;--muted:#333;--line:#999;--surface2:#f1f1f1}
  .top,#side,#toTop,.chnav,#scrim,.btn,.cmds,.sim input,#tipbox{display:none!important}
  .layout{display:block;padding:0}
  details{display:block}details>div.dbody{display:block}
  .chapter{page-break-before:always;animation:none}
  .card,.fig,.concept,.sim{break-inside:avoid;box-shadow:none}
  .flip{height:auto}.flip .in{transform:none!important;display:grid;gap:.4rem}.flip .f,.flip .b{position:static;transform:none;backface-visibility:visible;background:#fff;color:#000}
  a{color:#000}
}

<script>
'use strict';
/* ========== helpers ========== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={
  get(k,d){try{const v=localStorage.getItem('osf.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('osf.'+k,JSON.stringify(v))}catch(e){}}
};
const ICONS={
  convenience:'M5 3l14 8-6 2-2 6z',
  efficiency:'M13 2L4 14h7l-1 8 9-12h-7z',
  resource:'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z',
  security:'M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z',
  reliability:'M12 3a9 9 0 100 18 9 9 0 000-18zM8 12l3 3 5-6',
  evolve:'M12 20V5M6 11l6-6 6 6M5 20h14',
  program:'M6 4l14 8-14 8z',
  io:'M4 8h14l-4-4M20 16H6l4 4',
  file:'M6 3h8l4 4v14H6zM14 3v5h5',
  comm:'M4 5h16v11H9l-5 4z',
  error:'M12 3l10 18H2zM12 10v5M12 18v.5',
  accounting:'M12 3a9 9 0 100 18 9 9 0 000-18zM12 7v5l3 2'
};
const icon=(n,s=24)=>`<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICONS[n]||ICONS.program}"/></svg>`;

/* tooltips: [[term]] or [[term|shown text]] */
let TIPLOOK=null;
function buildTips(){
  TIPLOOK={};
  TIPS_EXTRA.concat(GLOSSARY).forEach(g=>{TIPLOOK[g.t.toLowerCase()]=g.d});
}
function tipify(h){
  if(!TIPLOOK)buildTips();
  return h.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,t,d)=>{
    const def=TIPLOOK[t.toLowerCase()];
    return def?`<span class="tip" tabindex="0" data-tip="${esc(def)}">${d||t}</span>`:(d||t);
  });
}

/* ========== SVG building blocks ========== */
function fig(w,h,inner,cap,label,narrow){
  return `<figure class="fig${narrow?' narrow':''}"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label||cap||'Diagram')}">${inner}</svg>${cap?`<figcaption>${cap}</figcaption>`:''}</figure>`;
}
function bx(x,y,w,h,label,n=1,o={}){
  const lines=String(label).split('\n'),lh=18;
  const y0=y+h/2-(lines.length-1)*lh/2+5.5;
  const t=lines.map((l,i)=>`<text x="${x+w/2}" y="${y0+i*lh}" text-anchor="middle"${o.sm?' class="sm"':''}>${esc(l)}</text>`).join('');
  return `<g class="bx b${n} ${o.cls||''}" ${o.attr||''}><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.rx??10}"/>${t}</g>`;
}
function arrow(x1,y1,x2,y2,dash){return `<line class="ar${dash?' dash':''}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" marker-end="url(#ah)"/>`}
function txt(x,y,s,cls='',anchor='middle'){return `<text x="${x}" y="${y}" text-anchor="${anchor}" class="${cls}">${esc(s)}</text>`}

/* ========== interactive widget registry ========== */
const CFG={}; const WIDGETS={};
const widget=(name,cfgKey,extra='')=>`<div data-widget="${name}" data-cfg="${cfgKey}" ${extra}></div>`;

/* stackinfo: clickable layered diagram with an explanation panel */
WIDGETS.stackinfo=el=>{
  const c=CFG[el.dataset.cfg],W=c.w||680,L=c.layers;
  let y=10,out='',pos=[];
  L.forEach((l,i)=>{
    const h=l.subs?(l.subH||96):(l.h||52);
    pos.push({y,h});
    let g=`<g class="bx b${l.n} click layer" tabindex="0" role="button" aria-label="${esc(l.t)}" data-i="${i}"><rect x="10" y="${y}" width="${W-20}" height="${h}" rx="12"/>`;
    g+=`<text x="${W/2}" y="${y+(l.subs?24:h/2+5.5)}" text-anchor="middle" class="bold">${esc(l.t)}</text>`;
    if(l.subs){
      const k=l.subs.length,gap=8,sw=(W-20-24-(k-1)*gap)/k;
      l.subs.forEach((s,j)=>{
        const sx=22+j*(sw+gap),lines=s.split('\n');
        g+=`<rect x="${sx}" y="${y+38}" width="${sw}" height="${h-50}" rx="8" style="fill:var(--surface);stroke:var(--line);stroke-width:1.5"/>`;
        lines.forEach((ln,q)=>{g+=`<text x="${sx+sw/2}" y="${y+38+(h-50)/2+5-(lines.length-1)*8+q*16}" text-anchor="middle" class="sm" style="font-weight:600">${esc(ln)}</text>`});
      });
    }
    g+='</g>';
    out+=g;y+=h;
    if(i<L.length-1){const a=c.gap||26;out+=arrow(W/2,y+2,W/2,y+a-3,false);if(c.bi)out+=`<line class="ar" x1="${W/2}" y1="${y+a-3}" x2="${W/2}" y2="${y+2}" marker-end="url(#ah)" style="display:none"/>`;y+=a}
  });
  const H=y+10;
  el.innerHTML=`<div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,22rem),1fr));align-items:start">${fig(W,H,out,c.cap||'Click a layer to read more.',c.label)}<div class="card infobox" aria-live="polite"><span class="lab">Click any layer</span><p>${c.hint||'Select a part of the diagram to see what it does.'}</p></div></div>`;
  const info=$('.infobox',el);
  const sel=i=>{
    $$('.layer',el).forEach(g=>g.classList.toggle('active',+g.dataset.i===i));
    const l=L[i];info.innerHTML=tipify(`<span class="lab">${esc(c.role||'Layer')}</span><h4>${esc(l.t)}</h4><p>${l.info}</p>${l.ex?`<p><b>Example:</b> ${l.ex}</p>`:''}`);
  };
  $$('.layer',el).forEach(g=>{
    g.addEventListener('click',()=>sel(+g.dataset.i));
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();sel(+g.dataset.i)}});
  });
  if(c.start!=null)sel(c.start);
};

/* hubinfo: centre node with clickable spokes (interactive mind map style) */
WIDGETS.hubinfo=el=>{
  const c=CFG[el.dataset.cfg],N=c.items.length,W=820,H=c.h||470,cx=W/2,cy=H/2;
  const rx=c.rx||305,ry=c.ry||(H/2-48),nw=c.nw||150,nh=c.nh||50;
  let out='',nodes='';
  c.items.forEach((it,i)=>{
    const a=-Math.PI/2+i*2*Math.PI/N,x=cx+rx*Math.cos(a),y=cy+ry*Math.sin(a);
    out+=`<line class="ln" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" style="stroke-width:3"/>`;
    nodes+=bx(x-nw/2,y-nh/2,nw,nh,it.t,it.n||((i%6)+1),{cls:'click hub',attr:`tabindex="0" role="button" aria-label="${esc(it.t.replace(/\n/g,' '))}" data-i="${i}"`});
  });
  out+=nodes+`<g class="bx b0"><circle cx="${cx}" cy="${cy}" r="${c.cr||64}" style="stroke-width:3"/>${c.center.split('\n').map((l,i,a)=>`<text x="${cx}" y="${cy+5.5+(i-(a.length-1)/2)*19}" text-anchor="middle" class="bold">${esc(l)}</text>`).join('')}</g>`;
  el.innerHTML=`<div class="stack">${fig(W,H,out,c.cap||'Click any node to read more.',c.label)}<div class="card infobox" aria-live="polite"><span class="lab">Click a node</span><p>${c.hint||''}</p></div></div>`;
  const info=$('.infobox',el);
  const sel=i=>{
    $$('.hub',el).forEach(g=>g.classList.toggle('active',+g.dataset.i===i));
    const it=c.items[i];
    info.innerHTML=tipify(`<span class="lab">${esc(c.role||'Topic')}</span><h4>${icon(it.ic||'program',22)} ${esc(it.t.replace(/\n/g,' '))}</h4>${it.rows?`<div class="grid3" style="margin-top:.5rem">${it.rows.map(r=>`<div class="callout ${r[2]||''}"><span class="lab">${r[0]}</span>${r[1]}</div>`).join('')}</div>`:`<p>${it.info}</p>`}`);
  };
  $$('.hub',el).forEach(g=>{
    g.addEventListener('click',()=>sel(+g.dataset.i));
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();sel(+g.dataset.i)}});
  });
};

/* stepflow: boxes joined by arrows, stepped through with Play */
WIDGETS.stepflow=el=>{
  const c=CFG[el.dataset.cfg],S=c.steps,N=S.length,W=860,gap=c.gap||50,bw=(W-20-(N-1)*gap)/N,bh=70;
  let out='';
  S.forEach((s,i)=>{
    const x=10+i*(bw+gap);
    out+=bx(x,40,bw,bh,s.t,s.n||((i%6)+1),{cls:'step',attr:`data-i="${i}"`});
    out+=txt(x+bw/2,28,`Step ${i+1}`,'sm mut');
    if(i<N-1)out+=arrow(x+bw+4,75,x+bw+gap-4,75);
  });
  out+=`<circle class="flow-dot" r="9" cx="10" cy="75" style="fill:var(--h3);stroke:var(--fg);stroke-width:2;opacity:0" />`;
  el.innerHTML=`<div class="stack">${fig(W,140,out,c.cap,c.label)}<div class="card infobox"><div class="row"><button class="btn" data-a="play">▶ Play</button><button class="btn ghost" data-a="next">Next step</button><button class="btn ghost" data-a="reset">Reset</button></div><p class="cap" style="margin-top:.7rem" aria-live="polite">${esc(c.hint||'Press Play to watch the steps.')}</p></div></div>`;
  let cur=-1,timer=null;
  const dot=$('.flow-dot',el),cap=$('.cap',el),steps=$$('.step',el);
  const go=i=>{
    cur=i;steps.forEach((g,j)=>{g.classList.toggle('lit',j===i);g.classList.toggle('dim',i>=0&&j>i)});
    if(i>=0){const g=steps[i].querySelector('rect');const x=+g.getAttribute('x')+bw/2;dot.setAttribute('cx',x);dot.style.opacity=1;cap.innerHTML=tipify(`<b>${esc(S[i].t.replace(/\n/g,' '))}:</b> ${S[i].cap}`)}
    else{dot.style.opacity=0;cap.textContent=c.hint||''}
  };
  const stop=()=>{clearInterval(timer);timer=null;$('[data-a=play]',el).textContent='▶ Play'};
  el.addEventListener('click',e=>{
    const a=e.target.closest('[data-a]')?.dataset.a;const st=e.target.closest('.step');
    if(st){stop();go(+st.dataset.i);return}
    if(a==='next'){stop();go(cur>=N-1?0:cur+1)}
    if(a==='reset'){stop();go(-1)}
    if(a==='play'){
      if(timer){stop();return}
      $('[data-a=play]',el).textContent='❚❚ Pause';if(cur>=N-1)cur=-1;
      go(cur+1);timer=setInterval(()=>{if(cur>=N-1){stop();return}go(cur+1)},1900);
    }
  });
  new MutationObserver(()=>{if(!document.body.contains(el))stop()}).observe(document.body,{childList:true,subtree:true});
  go(-1);
};

/* ========== static diagram library ========== */
const DG={};

  o+=txt(90,130,'Manager','sm mut');

  o+=txt(200,46,'ONE PROCESS (e.g. web browser)','ttl');
  o+=bx(40,64,320,42,'Shared: code + data + open files',3,{sm:true});
  [['Thread 1\nUser interface',1],['Thread 2\nNetwork',2],['Thread 3\nRendering',6]].forEach((t,i)=>{

DG.distributed=()=>{

  pcs.forEach((p,i)=>{o+=bx(p[1],p[2],150,56,p[0]+'\nown CPU + RAM',[1,2,3,4][i],{sm:true});o+=`<line class="ln" x1="210" y1="${p[2]+28}" x2="330" y2="200" style="stroke-width:3"/>`});
  o+=`<ellipse cx="380" cy="200" rx="70" ry="48" style="fill:var(--surface2);stroke:var(--muted);stroke-width:2.5"/>`+txt(380,196,'Network','bold')+txt(380,215,'(LAN / Internet)','sm mut');

  o+=txt(676,330,'Resource sharing · Load balancing · Fault tolerance','sm mut');
  return fig(880,360,o,'Many connected computers are managed by one distributed OS so they look like one system.','Distributed OS network diagram');
};

/* ========== comparison tables, concept cards ========== */
const dots=(n,low)=>`<span class="dots${low?' low':''}" role="img" aria-label="${n} out of 5">${[1,2,3,4,5].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</span>`;
function cmpTable(head,rows,cap){
  return `<div class="tablewrap" role="region" tabindex="0" aria-label="${esc(cap||'Comparison table')}"><table class="cmp"><thead><tr>${head.map((h,i)=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr><th scope="row">${r[0]}</th>${r.slice(1).map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
const list=(a,c)=>`<ul class="${c}">${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
/* the ten-part teaching pattern */
function concept(o){

/* ========== multiprogramming simulator ========== */
WIDGETS.multiprog=el=>{
  el.innerHTML=`<div class="sim"><h4>Try it: does the CPU stay busy?</h4>
  <p>Each program computes for 2 ticks, then waits 3 ticks for I/O (like reading a file). Press <b>Next tick</b> or <b>Auto-run</b>.</p>
  <div class="row"><label><input type="checkbox" id="mpOn" checked> Multiprogramming ON (4 programs in RAM)</label>
  <button class="btn" data-a="tick">Next tick</button><button class="btn ghost" data-a="auto">Auto-run</button><button class="btn ghost" data-a="reset">Reset</button></div>
  <div data-s="fig" style="margin-top:.8rem"></div>
  <div class="meter"><div><span class="lab">CPU busy</span><div class="stat" data-s="util">0%</div><div class="bar"><i data-s="bar" style="width:0"></i></div></div><div><span class="lab">Ticks</span><div class="stat" data-s="t">0</div></div><div><span class="lab">Now running</span><div class="stat" data-s="cur">none</div></div></div></div>`;
  let progs,cur,busy,total,last,timer=null;
  const reset=()=>{
    const n=$('#mpOn',el).checked?4:1;
    progs=['A','B','C','D'].slice(0,n).map(nm=>({nm,st:'ready',run:2,wait:0}));
    cur=null;busy=0;total=0;last=-1;draw();
  };
  const draw=()=>{
    const cls={A:1,B:4,C:6,D:3};
    let o=bx(20,10,260,34,'MAIN MEMORY (RAM)',0,{sm:true,rx:6});
    progs.forEach((p,i)=>{
      const y=54+i*62,state=p.st==='run'?'RUNNING':p.st==='wait'?'WAITING FOR I/O ('+p.wait+')':'READY';
      o+=bx(20,y,260,52,`Program ${p.nm}\n${state}`,cls[p.nm],{sm:true,cls:p.st==='run'?'lit':p.st==='wait'?'dead':''});
      if(p.st==='run')o+=arrow(282,y+26,380,100);
    });
    o+=bx(384,60,150,80,cur?`CPU\nexecuting ${cur.nm}`:'CPU\nIDLE',cur?2:0,{sm:true,cls:cur?'lit':'dead'});
    return $('[data-s=fig]',el).innerHTML=fig(560,54+progs.length*62,o,'Programs wait in RAM; the CPU runs whichever one is ready.','Multiprogramming simulator'),
      ($('[data-s=util]',el).textContent=total?Math.round(100*busy/total)+'%':'0%'),
      ($('[data-s=bar]',el).style.width=(total?100*busy/total:0)+'%'),
      ($('[data-s=t]',el).textContent=total),
      ($('[data-s=cur]',el).textContent=cur?'Program '+cur.nm:'nobody (CPU idle)');
  };
  const tick=()=>{
    progs.forEach(p=>{if(p.st==='wait'){p.wait--;if(p.wait<=0){p.st='ready';p.run=2}}});
    if(!cur){
      for(let k=1;k<=progs.length;k++){const i=(last+k)%progs.length;if(progs[i].st==='ready'){cur=progs[i];cur.st='run';last=i;break}}
    }
    total++;
    if(cur){busy++;cur.run--}
    draw();
    if(cur&&cur.run<=0){cur.st='wait';cur.wait=4;cur=null}
  };
  el.addEventListener('click',e=>{
    const a=e.target.closest('[data-a]')?.dataset.a;if(!a)return;
    if(a==='tick')tick();
    if(a==='reset'){clearInterval(timer);timer=null;reset()}
    if(a==='auto'){if(timer){clearInterval(timer);timer=null}else timer=setInterval(()=>{if(!document.body.contains(el)){clearInterval(timer);return}tick()},700)}
  });
  $('#mpOn',el).addEventListener('change',()=>{clearInterval(timer);timer=null;reset()});
  reset();for(let i=0;i<10;i++)tick();
};

/* ========== time-sharing (round robin) ========== */
WIDGETS.rr=el=>{
  const jobs=[['A',9],['B',6],['C',8]];
  el.innerHTML=`<div class="sim"><h4>Try it: change the time slice</h4>
  <p>Three processes need 9 ms, 6 ms and 8 ms of CPU. The OS gives each one a time slice in turn.</p>
  <label for="qs">Time slice: <b data-s="q">3</b> ms</label><br><input id="qs" type="range" min="1" max="9" value="3" aria-label="Time slice in milliseconds">
  <div class="seq" data-s="seq" aria-label="Order in which processes get the CPU"></div>
  <div class="meter"><div><span class="lab">Slices given</span><div class="stat" data-s="n">0</div></div><div><span class="lab">Context switches</span><div class="stat" data-s="cs">0</div></div></div>
  <p data-s="msg" style="margin-top:.6rem"></p></div>`;
  const run=()=>{
    const q=+$('#qs',el).value;$('[data-s=q]',el).textContent=q;
    let rem=jobs.map(j=>j[1]),seq=[],i=0;
    while(rem.some(r=>r>0)){
      if(rem[i]>0){const d=Math.min(q,rem[i]);rem[i]-=d;seq.push([jobs[i][0],d])}
      i=(i+1)%jobs.length;
    }
    let cs=0;for(let k=1;k<seq.length;k++)if(seq[k][0]!==seq[k-1][0])cs++;
    $('[data-s=seq]',el).innerHTML=seq.map((s,k)=>`<span class="p${s[0]}" style="flex:${s[1]} 1 ${s[1]*1.6}rem;animation:rise .4s ${k*0.05}s both">${s[0]} · ${s[1]}ms</span>`).join('');
    $('[data-s=n]',el).textContent=seq.length;$('[data-s=cs]',el).textContent=cs;
    $('[data-s=msg]',el).innerHTML=q<=1?'Very small slices: everyone is served quickly, but the OS wastes a lot of time on context switches.':q>=9?'Slice as long as the longest job: each process runs to the end before the next starts. It is no longer interactive.':'A balanced slice: users get quick responses and context switches stay reasonable.';
  };
  $('#qs',el).addEventListener('input',run);run();
};

/* ========== real-time deadline ========== */
WIDGETS.rtos=el=>{
  el.innerHTML=`<div class="sim"><h4>Try it: meet the deadline</h4>
  <p>An event happens at time 0. The deadline is <b>10 ms</b>. Slide the processing time and see what happens.</p>
  <div class="row"><label><input type="radio" name="rtk" value="hard" checked> Hard real-time (airbag)</label><label><input type="radio" name="rtk" value="soft"> Soft real-time (video call)</label></div>
  <label for="rtp">Processing time: <b data-s="p">6</b> ms</label><br><input id="rtp" type="range" min="1" max="20" value="6" aria-label="Processing time in milliseconds">
  <div style="position:relative;margin:1.6rem 0 .4rem"><div class="bar" style="height:1.8rem"><i data-s="fill" style="width:30%"></i></div>
  <div style="position:absolute;left:50%;top:-1.1rem;bottom:-.3rem;border-left:3px dashed var(--bad)"></div></div>
  <div class="row" style="justify-content:space-between;font-size:.85rem;color:var(--muted)"><span>EVENT (0 ms)</span><span style="margin-left:25%">DEADLINE (10 ms)</span><span>20 ms</span></div>
  <div class="callout" data-s="out" style="margin-top:.8rem" aria-live="polite"></div></div>`;
  const upd=()=>{
    const p=+$('#rtp',el).value,hard=$('input[name=rtk]:checked',el).value==='hard';
    $('[data-s=p]',el).textContent=p;const f=$('[data-s=fill]',el);f.style.width=(p/20*100)+'%';
    const late=p>10,o=$('[data-s=out]',el);
    f.style.background=late?'var(--bad)':'var(--h2)';
    o.className='callout '+(late?'warn':'comp');
    o.innerHTML=late?(hard?'<span class="lab">Deadline missed</span><b>System failure.</b> In a hard real-time system a late answer is a wrong answer. The airbag opens too late.':'<span class="lab">Deadline missed</span><b>Quality drops.</b> In a soft real-time system the video freezes for a moment, but the call carries on.'):'<span class="lab">Deadline met</span>The result arrived in time. EVENT → PROCESSING → DEADLINE worked as designed.';
  };
  $$('input',el).forEach(i=>i.addEventListener('input',upd));upd();
};

/* ========== monolithic vs microkernel crash demo ========== */
WIDGETS.crash=el=>{
  el.innerHTML=`<div class="sim"><h4>Try it: a device driver crashes</h4><p>Press the button and watch which parts of the system survive.</p>
  <div class="row"><button class="btn" data-a="crash">Crash the disk driver</button><button class="btn ghost" data-a="fix">Restore</button></div>
  <div data-s="fig" style="margin-top:.8rem"></div><div class="callout" data-s="msg" aria-live="polite" style="margin-top:.6rem"></div></div>`;
  let dead=false;
  const draw=()=>{
    let o=txt(215,24,'MONOLITHIC KERNEL','ttl')+txt(645,24,'MICROKERNEL','ttl');
    o+=bx(20,40,390,40,'Applications',1,{sm:true});o+=arrow(215,80,215,98);
    o+=bx(20,100,390,210,'',dead?4:5,{cls:dead?'dead':''});
    o+=txt(215,124,dead?'ONE BIG KERNEL: CRASHED':'ONE BIG KERNEL (everything inside)','bold');
    ['Process mgmt','Memory mgmt','File system','Networking'].forEach((s,i)=>{o+=bx(36+(i%2)*190,140+Math.floor(i/2)*50,170,40,s,dead?4:2,{sm:true,cls:dead?'dead':''})});
    o+=bx(36,246,358,46,dead?'Disk driver (FAILED)':'Disk driver',4,{sm:true,cls:dead?'dead':''});
    o+=bx(450,40,390,40,'Applications',1,{sm:true});o+=arrow(645,80,645,98);
    o+=bx(450,100,390,100,'USER SPACE servers',dead?0:0,{});
    o+=bx(462,128,112,58,'File\nserver',2,{sm:true});o+=bx(584,128,112,58,'Network\nserver',2,{sm:true});
    o+=bx(706,128,122,58,dead?'Disk driver\n(FAILED)':'Disk driver',4,{sm:true,cls:dead?'dead':''});
    o+=arrow(645,200,645,218);
    o+=bx(450,220,390,90,'MICROKERNEL\nIPC · scheduling · basic memory',dead?5:5,{sm:true});
    o+=arrow(215,310,215,330);o+=arrow(645,310,645,330);
    o+=bx(20,332,820,36,'HARDWARE',0,{sm:true});
    $('[data-s=fig]',el).innerHTML=fig(860,384,o,'Left: all services share one kernel. Right: only essential services are in the kernel.','Monolithic kernel compared with microkernel');
    $('[data-s=msg]',el).innerHTML=dead?'<span class="lab">Result</span><b>Monolithic:</b> the driver runs inside the kernel, so a bug can crash the whole system (blue screen / kernel panic). <b>Microkernel:</b> the driver is a normal user-space server. Only it fails, and the OS can restart it.':'<span class="lab">Ready</span>Everything is working. Press the button to simulate a faulty driver.';
  };
  el.addEventListener('click',e=>{const a=e.target.closest('[data-a]')?.dataset.a;if(a==='crash'){dead=true;draw()}if(a==='fix'){dead=false;draw()}});
  draw();
};

const MM=[
 {t:'Fundamentals',n:1,a:-150,r:165,ch:'intro',kids:[['Definition','intro',''],['Goals','goals',''],['Services','services','']]},
 {t:'Types',n:2,a:-40,r:175,ch:'types',spread:30,kr:340,kids:[['Multiprogramming','types','multiprog'],['Time Sharing','types','timeshare'],['Real Time','types','rtos'],['Multithreading','types','multithread'],['Distributed','types','distributed'],['Embedded','types','embedded']]},

];
WIDGETS.mindmap=el=>{
  const W=1000,H=700,cx=500,cy=350,open=store.get('mmopen',{0:1,1:1,2:1,3:1});
  el.innerHTML=`<div class="stack"><div class="row"><button class="btn ghost" data-a="all">Expand all</button><button class="btn ghost" data-a="none">Collapse all</button><span class="chip">Click a branch to fold it. Click a topic to jump to its section.</span></div><div class="mm card" style="padding:.5rem" role="group" aria-label="Interactive mind map of the whole module"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mind map of operating system topics"></svg></div></div>`;
  const svg=$('svg',el),sel=store.get('mmsel','');
  const rad=d=>d*Math.PI/180;
  const draw=()=>{
    let edges='',nodes='';
    MM.forEach((b,i)=>{
      const bx0=cx+b.r*Math.cos(rad(b.a)),by0=cy+b.r*Math.sin(rad(b.a));
      edges+=`<line class="edge" x1="${cx}" y1="${cy}" x2="${bx0}" y2="${by0}" style="stroke:var(--h${b.n});stroke-width:4"/>`;
      const k=b.kids.length,sp=b.spread||24,kr=b.kr||300;
      b.kids.forEach((kd,j)=>{
        const ang=b.a+(k===1?0:(j-(k-1)/2)*(sp*2/(k-1))*(k===3?1:1));
        const x=cx+kr*Math.cos(rad(ang)),y=cy+kr*Math.sin(rad(ang)),hid=!open[i]?' hidden':'';
        edges+=`<line class="edge${hid}" data-b="${i}" x1="${bx0}" y1="${by0}" x2="${x}" y2="${y}" style="stroke:var(--h${b.n});stroke-width:2.2"/>`;
        const key=kd[1]+'#'+kd[2];
        nodes+=`<g class="node leaf kid${hid} bx b${b.n}${sel===key?' sel':''}" data-b="${i}" data-ch="${kd[1]}" data-an="${kd[2]}" data-key="${esc(key)}" tabindex="${open[i]?0:-1}" role="link" aria-label="Go to ${esc(kd[0])}"><rect x="${x-68}" y="${y-17}" width="136" height="34" rx="17"/><text x="${x}" y="${y+5}" text-anchor="middle" style="font-size:14px">${esc(kd[0])}</text></g>`;
      });
      nodes+=`<g class="node branch bx b${b.n}" data-i="${i}" tabindex="0" role="button" aria-expanded="${!!open[i]}" aria-label="${b.t} branch"><rect x="${bx0-72}" y="${by0-22}" width="144" height="44" rx="22"/><text x="${bx0}" y="${by0+5.5}" text-anchor="middle" style="font-size:16px">${b.t} ${open[i]?'▾':'▸'}</text></g>`;
    });
    nodes+=`<g class="node center bx b0" tabindex="0" role="button" aria-label="Expand all branches"><ellipse cx="${cx}" cy="${cy}" rx="88" ry="46" style="stroke-width:3.5"/><text x="${cx}" y="${cy-2}" text-anchor="middle" style="font-size:16px;font-family:var(--f-display)">OPERATING</text><text x="${cx}" y="${cy+18}" text-anchor="middle" style="font-size:16px;font-family:var(--f-display)">SYSTEM</text></g>`;
    svg.innerHTML=edges+nodes;
  };
  const setAll=v=>{MM.forEach((_,i)=>open[i]=v?1:0);store.set('mmopen',open);draw()};
  svg.addEventListener('click',e=>{
    const n=e.target.closest('.node');if(!n)return;
    if(n.classList.contains('center')){setAll(1);return}
    if(n.classList.contains('branch')){const i=n.dataset.i;open[i]=open[i]?0:1;store.set('mmopen',open);draw();return}
    if(n.classList.contains('leaf')){store.set('mmsel',n.dataset.key);$$('.leaf',svg).forEach(g=>g.classList.toggle('sel',g===n));setTimeout(()=>go(n.dataset.ch,n.dataset.an),180)}
  });
  svg.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.closest('.node')){e.preventDefault();e.target.closest('.node').dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
  el.addEventListener('click',e=>{const a=e.target.closest('[data-a]')?.dataset.a;if(a==='all')setAll(1);if(a==='none')setAll(0)});
  draw();
};

/* ========== quiz ========== */
WIDGETS.quiz=el=>{
  let i=0,score=0,answered=false,wrong=[];
  const total=QUIZ.length;
  const render=()=>{
    if(i>=total){
      const pct=Math.round(100*score/total);
      const msg=pct>=90?'Excellent! You have mastered Operating System fundamentals.':pct>=75?'Very good. Revise the topics you missed and try again.':pct>=50?'Fair attempt. Go through the flashcards and the comparison tables, then retry.':'Keep going. Read the chapters again slowly, look at the diagrams, then retry.';
      el.innerHTML=`<div class="card qwrap"><h3>Quiz complete</h3><div class="score"><div><b>${total}</b>Total questions</div><div><b style="color:var(--good)">${score}</b>Correct answers</div><div><b style="color:var(--bad)">${total-score}</b>Wrong answers</div><div><b>${pct}%</b>Percentage</div></div><div class="callout ${pct>=50?'comp':'warn'}"><span class="lab">Performance</span><p><b>${msg}</b></p></div>${wrong.length?`<details><summary>Review the ${wrong.length} question${wrong.length>1?'s':''} you missed</summary><div class="dbody">${wrong.map(w=>`<p><b>Q${w+1}. ${tipify(QUIZ[w].q)}</b><br>Correct answer: ${esc(QUIZ[w].o[QUIZ[w].a])}<br><span style="color:var(--muted)">${tipify(QUIZ[w].e)}</span></p>`).join('')}</div></details>`:''}<div class="row" style="margin-top:1rem"><button class="btn" data-a="restart">Try again</button></div></div>`;
      return;
    }
    const q=QUIZ[i];answered=false;
    el.innerHTML=`<div class="card qwrap"><div class="row" style="justify-content:space-between"><span class="qnum">Question ${i+1} of ${total}</span><span class="chip">Score: ${score}</span></div><div class="bar" style="margin:.5rem 0"><i style="width:${100*i/total}%;background:var(--accent)"></i></div><div class="qq">${tipify(q.q)}</div><div role="group" aria-label="Answer options">${q.o.map((o,k)=>`<button class="qopt" data-k="${k}"><b>${'ABCD'[k]}.</b> ${esc(o)}</button>`).join('')}</div><div data-s="fb" aria-live="polite"></div></div>`;
  };
  el.addEventListener('click',e=>{
    const a=e.target.closest('[data-a]')?.dataset.a;
    if(a==='restart'){i=0;score=0;wrong=[];render();return}
    if(a==='next'){i++;render();el.scrollIntoView({block:'nearest'});return}
    const b=e.target.closest('.qopt');if(!b||answered)return;
    answered=true;const k=+b.dataset.k,q=QUIZ[i],ok=k===q.a;
    if(ok)score++;else wrong.push(i);
    $$('.qopt',el).forEach((x,j)=>{x.disabled=true;if(j===q.a)x.classList.add('right');else if(j===k)x.classList.add('wrong')});
    $('[data-s=fb]',el).innerHTML=`<div class="callout ${ok?'comp':'warn'}" style="margin-top:.8rem"><span class="lab">${ok?'Correct':'Not quite. The right answer is '+'ABCD'[q.a]}</span><p>${tipify(q.e)}</p></div><div class="row" style="margin-top:.8rem"><button class="btn" data-a="next">${i===total-1?'See my result':'Next question'}</button></div>`;
  });
  render();
};

CH.push({id:'goals',title:'Fundamental Goals of Operating System',short:'OS Goals',render(){

  <div class="callout exam" style="margin-top:1rem"><span class="lab">Exam-oriented summary</span><p>The fundamental goals of an OS are <b>convenience, efficiency, resource management, security and protection, reliability and the ability to evolve</b>.</p></div>`;

  ${sec('E. Distributed Operating System')}

CH.push({id:'structure',title:'Operating System Structure',short:'OS Structure',render(){
  return `${chHead('Chapter 5','Operating System Structure','An OS is huge. How its parts are arranged decides its speed, safety and ease of change.')}
  <div class="callout"><span class="lab">Why do we need an OS structure?</span><p>A big school building needs a plan: classrooms, labs, offices. Without a plan it becomes a maze. In the same way, millions of lines of OS code need a clear structure so that people can understand, fix and extend it. The three classic designs are <b>layered</b>, <b>monolithic</b> and <b>microkernel</b>.</p></div>
  ${sec('A. Layered Operating System')}
  ${concept({id:'layered',badge:'A',title:'Layered Operating System',
   def:'The OS is built as a stack of layers. Each layer provides services to the layer above and uses the services of the layer below.',
   why:'Dividing a large problem into small levels makes the system easier to build, test and understand.',
   how:'Layer 0 is the hardware. Each higher layer is built only on the layers beneath it. A request travels down through the layers, and the answer travels back up.',
   diagram:widget('stackinfo','layered'),
   real:'A burger shop: the customer orders at the counter, the counter passes it to the kitchen, the kitchen uses ingredients from the store. Each stage talks only to the next.',
   comp:'The THE operating system (Dijkstra) and parts of modern systems such as network protocol stacks use layering.',
   adv:['Easy to understand','Easier debugging: test one layer at a time','Better modularity'],
   dis:['Performance overhead because requests pass through many layers','Defining the layers correctly can be difficult'],
   pts:['A layer can only use layers below it.','Pure layered OS designs are rare today; layering is used inside other designs.'],
   exam:'In a <b>layered operating system</b>, the OS is divided into a number of layers, where each layer is built on top of lower layers. The bottom layer (layer 0) is the hardware and the highest layer is the user interface.'})}
  ${sec('B. Monolithic Operating System')}
  ${concept({id:'monolithic',badge:'B',title:'Monolithic Operating System',
   def:'All major OS services run inside <b>one large kernel</b> in kernel mode, sharing one memory space.',
   why:'Direct function calls between parts are very fast, and the design is simple to start with.',
   how:'Applications use the system call interface to enter the kernel. Process management, memory management, file system, device drivers and networking are all part of that same kernel program.',
   diagram:widget('stackinfo','mono'),
   real:'A small shop where one person is cashier, cook and cleaner. Everything is quick because there is no hand-over, but if that person falls ill, the shop closes.',
   comp:'<b>Linux</b> is the most important case study. It is monolithic but modular (loadable kernel modules). Traditional UNIX and early MS-DOS were also simple monolithic systems.',
   adv:['High performance','Direct communication between components'],
   dis:['Large kernel','Difficult maintenance','One kernel failure can affect the whole system'],
   pts:['Everything runs in kernel mode.','Modern monolithic kernels such as Linux use <b>modules</b> to add or remove drivers without rebooting.'],
   exam:'A <b>monolithic kernel</b> is an OS architecture in which the entire operating system works in kernel space as a single large program, with all services tightly integrated.'})}
  ${sec('C. Microkernel Operating System')}
  ${concept({id:'microkernel',badge:'C',title:'Microkernel Operating System',
   def:'Only the <b>essential services</b> stay inside the kernel. Everything else runs in user space as separate servers.',
   why:'Less code in kernel mode means fewer places for a fatal bug, and services can be replaced or restarted independently.',
   how:'The microkernel offers inter-process communication (IPC), CPU scheduling and basic memory management. A file server or device driver is a normal process; programs reach it by sending messages through the microkernel.',
   diagram:widget('stackinfo','micro'),
   real:'A manager who only hands out jobs and passes notes. Specialists do the real work in their own offices. If one specialist is sick, only that office closes.',
   comp:'MINIX 3, QNX and L4 are microkernel systems. Mach, the base of macOS, started as a microkernel.',
   adv:['Better modularity','Better reliability','Easier maintenance','Better isolation'],
   dis:['Communication overhead (messages)','More context switches between user and kernel mode'],
   pts:['Policy runs in user space; only mechanism stays in the kernel.','Often slower than monolithic if the message passing is not optimised.'],
   exam:'A <b>microkernel</b> is a minimal kernel that provides only basic services such as IPC, scheduling and basic memory management, while other OS services run as user-space processes.'})}
  ${sec('Comparison diagram: monolithic kernel versus microkernel')}
  ${DG.monoVsMicro()}`;
}});
/* ---- Chapter 6: comparison of structures ---- */
CH.push({id:'compare',title:'Comparison of OS Structures',short:'Compare Structures',render(){
  const T=(a,b)=>`<span class="tip" tabindex="0" data-tip="${esc(b)}">${a}</span>`;
  return `${chHead('Chapter 6','Comparison of OS Structures','Layered, monolithic and microkernel designs side by side. Hover over the labels for hints.')}
  ${cmpTable(['Feature','Layered','Monolithic','Microkernel'],[
   [T('Architecture','How the parts are arranged'),'Stack of layers; each uses the one below','One large kernel with all services inside','Small kernel; services run in user space'],
   [T('Performance','Speed of normal operation'),dots(2,1)+'Slower: requests pass through layers',dots(5)+'Fastest: direct calls inside the kernel',dots(3)+'Moderate: message passing costs time'],
   [T('Security','Isolation of faults and attacks'),dots(3)+'Fair: layers give some protection',dots(2,1)+'Lower: a kernel bug exposes everything',dots(4)+'Better: small trusted core, isolated servers'],
   [T('Modularity','How easily parts can be separated'),dots(4)+'Good',dots(2,1)+'Limited (modules help)',dots(5)+'Excellent'],
   [T('Complexity','How hard to design and understand'),dots(3)+'Moderate, but layering is hard to define',dots(2,1)+'Grows large and tangled over time',dots(3)+'Simple core, but many cooperating servers'],
   [T('Maintenance','How easy to fix and update'),dots(4)+'Easy to debug layer by layer',dots(2,1)+'Hard: everything is connected',dots(5)+'Easy: replace a server without a reboot'],
   [T('Examples','Real systems'),'THE OS; layered ideas inside protocol stacks and parts of other systems','Linux, traditional UNIX, early MS-DOS','MINIX 3, QNX, L4; Mach (core of macOS)']
  ],'Comparison of OS structures')}
  <div class="callout warn" style="margin-top:1rem"><span class="lab">Do not take the dots as final marks</span><p>The dots are a rough guide, not scores. Real operating systems <b>mix approaches</b>. Linux is monolithic but modular. Windows NT and macOS (XNU) are <b>hybrid</b> designs that keep some services in the kernel for speed while borrowing microkernel ideas. Layering is used inside almost all of them. Performance also depends on how well the code is written, not only on the structure.</p></div>
  ${sec('See the trade-off')}
  ${DG.monoVsMicro()}`;
}});

CH.push({id:'linux',title:'Case Study: Linux',short:'Linux',render(){
  return `${chHead('Chapter 7 · Case Study','Linux','A free, open-source operating system that powers servers, phones (Android) and supercomputers.')}
  <div class="callout"><span class="lab">Start with a simple example</span><p>Linux is like a recipe that is published for everyone. Anybody can read it, improve it and cook their own version. Ubuntu, Fedora and others are different "dishes" made from the same base.</p></div>
  ${sec('Architecture diagram')}
  ${widget('stackinfo','linuxarch')}
  ${sec('Linux kernel visual')}
  ${widget('hubinfo','linuxkernel')}
  ${sec('Linux explained')}
  ${concept({id:'linux-os',badge:'LX',title:'Linux',
   def:'<b>Linux</b> is a free, open-source, UNIX-like operating system. Strictly speaking, Linux is the [[kernel]]; with GNU tools and other software it becomes a complete system.',
   why:'In 1991 Linus Torvalds wanted a free UNIX-like kernel for his PC. Developers all over the world joined in, and it grew into the base of most servers and Android phones.',
   how:'The kernel runs in kernel mode and manages hardware. Users work through a [[shell]] or desktop. Programs call library functions that make system calls into the kernel. Everything is treated as a file (devices, even running processes).',
   diagram:'',
   real:'A public library: everyone can read the books (source code), suggest corrections and make their own copy.',
   comp:'A web server running Ubuntu, a Raspberry Pi running Raspberry Pi OS, an Android phone, and the world\'s fastest supercomputers all use the Linux kernel.',
   adv:['Free and open source','Stable, secure and fast','Highly customisable','Huge community and many distributions','Runs on everything from tiny devices to supercomputers'],
   dis:['Fewer commercial desktop applications and games','Many choices can confuse beginners','Hardware support and driver quality can vary','Command-line knowledge often helps'],
   pts:['Monolithic kernel with loadable modules.','Released under the GNU GPL licence (kernel: GPLv2).','Strong multi-user and multitasking design.'],
   exam:'<b>Linux</b> is an open-source, multi-user, multitasking, UNIX-like operating system whose kernel was created by Linus Torvalds in 1991 and is released under the GNU General Public License.'})}
  ${sec('Topic by topic')}
  ${detail('What is Linux?','<p>Linux is an operating system kernel started by <b>Linus Torvalds</b> in 1991 and now developed by thousands of people and companies. It follows the design ideas of UNIX but contains no UNIX source code.</p>',true)}
  ${detail('Linux kernel','<p>The kernel is the heart. It runs first, controls the CPU and memory, talks to devices through drivers, and offers system calls to programs. It is a <b>monolithic</b> kernel, but you can load or unload drivers as <b>modules</b> while it runs (for example with <code>modprobe</code>).</p>')}
  ${detail('GNU/Linux concept','<p>The <b>GNU Project</b> (started by Richard Stallman in 1983) built many tools: compiler (gcc), shell (bash), core utilities (ls, cp, cat). The Linux kernel completed the missing piece. Together they form a full system, which is why some people call it <b>GNU/Linux</b>.</p><p><b>Kernel + GNU tools + extra software = a Linux distribution.</b></p>')}
  ${detail('Linux distributions',`<p>A <b>distribution (distro)</b> packages the kernel with tools, a desktop, and a package manager.</p><div class="grid3">${DISTROS.map(d=>`<div class="card"><h4 style="color:var(--h${d[3]})">${d[0]}</h4><span class="chip">${d[1]}</span><p style="margin:.5rem 0 0">${d[2]}</p></div>`).join('')}</div>`)}
  ${detail('Kernel architecture','<p>See the kernel visual above. Main parts: <b>process management, memory management, file system (VFS), device drivers, networking and security</b>. They share one address space (monolithic) and communicate by direct function calls.</p>')}
  ${detail('Linux features','<ul class="pts"><li>Multi-user and multitasking</li><li>Portable: runs on x86, ARM, RISC-V and more</li><li>Open source: anyone can read and change the code</li><li>Hierarchical file system with one root <code>/</code></li><li>Powerful shell and scripting</li><li>Built-in networking and security</li></ul>')}
  ${detail('Linux file system','<p>Everything starts at the root <code>/</code>. There are no drive letters.</p>'+cmpTable(['Folder','Purpose'],[['/','Root of the whole tree'],['/home','Personal files of users'],['/etc','Configuration files'],['/bin, /usr/bin','Commands and programs'],['/var','Logs and changing data'],['/dev','Devices shown as files'],['/proc','Live information about processes'],['/tmp','Temporary files'],['/boot','Kernel and boot files']],'Linux folders')+'<p style="margin-top:.7rem">Common file systems: <b>ext4</b> (default on many distros), <b>XFS</b>, <b>Btrfs</b>.</p>')}
  ${detail('Linux process management','<p>Each running program is a <b>process</b> with a unique <b>PID</b>. New processes are created with <code>fork()</code> (copy the parent) and <code>exec()</code> (load a new program). The scheduler shares CPU time by priority and fairness. Use <code>ps</code> and <code>top</code> to see processes and <code>kill</code> to stop one.</p>')}
  ${detail('Linux memory management','<p>Every process sees its own <b>virtual memory</b>. The kernel maps it to real RAM in small blocks called <b>pages</b>. When RAM is full, rarely used pages move to <b>swap</b> on disk. A <b>page cache</b> keeps recent file data in RAM to speed things up.</p>')}
  ${detail('Linux security','<ul class="pts"><li>Users and groups; each file has read/write/execute permissions for owner, group and others</li><li><b>root</b> is the administrator; ordinary users use <code>sudo</code> when needed</li><li>Optional modules: <b>SELinux</b>, <b>AppArmor</b></li><li>Open source code can be inspected by many reviewers</li></ul>')}
  ${detail('Linux networking','<p>The TCP/IP stack is inside the kernel. Programs use <b>sockets</b>. The firewall framework <b>netfilter</b> (managed with iptables or nftables) filters packets. Tools: <code>ip</code>, <code>ping</code>, <code>ssh</code>. Linux is widely used for web servers and routers.</p>')}
  ${sec('Linux commands: try them')}
  ${widget('linuxterm','lt')}
  ${cmpTable(['Command','Meaning'],LCMD.map(c=>['<code>'+c[0]+'</code>',c[1]]),'Linux commands')}`;
}});

CH.push({id:'windows',title:'Case Study: Current Windows OS',short:'Windows',render(){
  const w=WIN_INFO;

  <div class="card" style="border-width:2px"><span class="lab">Current Windows release</span>
   <div class="verify"><div><div class="stat">${w.name}</div><div>Version <b>${w.version}</b></div></div><span class="pill">Last verified: ${w.verified}</span></div>
   <div class="grid2" style="margin-top:.8rem"><div><span class="lab">Released</span>${w.released}</div><div><span class="lab">How it arrives</span>${w.delivery}</div><div><span class="lab">Support period</span>${w.support}</div><div><span class="lab">Source</span>${w.source}. <a href="${w.url}" target="_blank" rel="noopener">Microsoft announcement</a></div></div>
   <div class="callout warn" style="margin-top:.8rem"><span class="lab">Check before you teach</span><p>Versions change every year, and this page cannot check Microsoft live. Please confirm the current version on Microsoft's official release health page: <a href="${w.check}" target="_blank" rel="noopener">learn.microsoft.com, Windows 11 release information</a>. A lecturer can update the details in one place (the <code>WIN_INFO</code> object in this file).</p></div></div>
  ${sec('Windows architecture')}
  ${widget('stackinfo','winarch')}
  ${sec('Windows explained')}
  ${concept({id:'windows-os',badge:'WN',title:'Microsoft Windows',
   def:'<b>Windows</b> is a family of proprietary operating systems from Microsoft. Modern Windows is built on the <b>Windows NT</b> kernel and offers a graphical desktop for PCs, laptops and servers.',
   why:'It gave ordinary people an easy graphical way to use PCs, and a huge range of software and hardware works with it.',
   how:'Applications call Windows APIs. These reach the kernel through the system call interface. In kernel mode, the Executive managers, the kernel, drivers and the HAL manage the hardware.',
   diagram:'',
   real:'A large office building with a reception (APIs), staff-only floors (kernel mode) and a security guard (UAC and Defender).',
   comp:'A school lab PC running Windows 11: you sign in, open Word, plug in a USB drive, and Windows loads the right driver automatically.',
   adv:['Largest software and game library on desktops','Wide hardware support','Familiar, easy interface','Strong business and management tools'],
   dis:['Commercial licence','A frequent target of malware because it is so common','Updates can interrupt work','Heavier on resources than some alternatives'],
   pts:['Kernel: Windows NT (hybrid design).','Two modes: user mode and kernel mode.','Main file system: NTFS.','Configuration data is stored in the Registry.'],
   exam:'<b>Windows</b> is a graphical, multitasking, proprietary operating system developed by Microsoft, based on the NT kernel, which separates execution into user mode and kernel mode.'})}
  ${sec('Topic by topic')}
  ${detail('Windows overview','<p>Windows runs on PCs, tablets, servers (Windows Server) and some devices. Today the main desktop line is <b>Windows 11</b>. It supports many hardware makers and a very large library of software.</p>',true)}
  ${detail('Windows kernel','<p>The <b>NT kernel</b> handles low-level jobs: thread scheduling, interrupts, and synchronization. It sits below the <b>Executive</b>, which provides services such as the Object Manager, Process Manager, Memory Manager, I/O Manager and the Security Reference Monitor. The design is called <b>hybrid</b> because it mixes ideas from microkernel and monolithic systems.</p>')}
  ${detail('User mode and kernel mode','<p>The CPU has two privilege levels. Applications run in <b>user mode</b> and cannot touch hardware. Core OS code and drivers run in <b>kernel mode</b> with full access. A system call moves from one to the other.</p>')}
  ${detail('Windows services','<p>Services are background programs without a window, for example Windows Update, Print Spooler and Windows Defender. They are managed by the <b>Service Control Manager</b>. You can see them in <code>services.msc</code>.</p>')}
  ${detail('File system','<p><b>NTFS</b> is the main file system. It supports large files, permissions (ACLs), encryption and journaling (recovery after a crash). Others: <b>ReFS</b> (servers), <b>exFAT</b> and <b>FAT32</b> (USB drives). Drives use letters such as C: and D:.</p>')}
  ${detail('Process management','<p>A process contains one or more threads. Windows schedules <b>threads</b> using a priority-based, pre-emptive scheduler. Use <b>Task Manager</b> to see processes, CPU and memory.</p>')}
  ${detail('Memory management','<p>Each process gets its own virtual address space. The <b>Memory Manager</b> uses paging and a <b>page file</b> on disk to extend RAM. Recently used pages of a process form its <b>working set</b>.</p>')}
  ${detail('Security','<p>Users sign in with a password, PIN or biometrics. Features include <b>User Account Control (UAC)</b>, <b>Windows Security (Defender)</b>, <b>BitLocker</b> disk encryption, <b>Secure Boot</b> and access control lists on files.</p>')}
  ${detail('Device management','<p>The <b>Plug and Play manager</b> detects new hardware and loads a driver. The <b>I/O Manager</b> sends requests to drivers. You can see devices in <b>Device Manager</b>.</p>')}

/* ========== glossary, tips, flashcards, quiz ========== */
const GLOSSARY=[
 {t:'Kernel',d:'The core part of the operating system. It runs in kernel mode and controls the CPU, memory and devices.'},
 {t:'Process',d:'A program that is running. It has its own memory, files and at least one thread.'},
 {t:'Thread',d:'The smallest unit of work the CPU can run. Threads of one process share its memory but have their own stack and registers.'},
 {t:'System Call',d:'A request from a program to the kernel to do something that needs special rights, such as reading a file.'},
 {t:'Scheduler',d:'The part of the OS that decides which process or thread uses the CPU next, and for how long.'},
 {t:'Context Switch',d:'Saving the state of the running process and loading the state of another, so the CPU can change tasks.'},
 {t:'Deadlock',d:'A stuck situation in which processes wait for each other\'s resources forever, so none can continue.'},
 {t:'Virtual Memory',d:'A technique that gives each process its own large address space by using disk space to extend RAM.'},
 {t:'File System',d:'The method the OS uses to name, store and organise files on a disk. Examples: ext4, NTFS, APFS.'},
 {t:'Device Driver',d:'A small program that lets the OS talk to one kind of hardware, such as a printer or graphics card.'},
 {t:'Shell',d:'A program that takes the user\'s commands and passes them to the OS. It can be text-based or graphical.'},
 {t:'GUI',d:'Graphical User Interface. Windows, icons, menus and a pointer, as on a desktop.'},
 {t:'CLI',d:'Command Line Interface. You type commands as text, for example in a terminal.'},
 {t:'IPC',d:'Inter-Process Communication. Ways for processes to exchange data, such as pipes, shared memory and messages.'},
 {t:'RTOS',d:'Real-Time Operating System. An OS that guarantees to respond to events within a fixed time limit.'},
 {t:'Microkernel',d:'A very small kernel with only basic services. Other services run in user space.'},
 {t:'Monolithic Kernel',d:'A kernel in which all main OS services run together in one large program in kernel mode.'},
 {t:'Multitasking',d:'Running several tasks at the same time, or switching so fast that they seem to run together.'},
 {t:'Multiprogramming',d:'Keeping several programs in memory so the CPU can switch to another when one waits for I/O.'},
 {t:'System Software',d:'Software that runs and manages the computer itself, such as the operating system and device drivers.'},
 {t:'Hardware',d:'The physical parts of a computer: CPU, memory, disk, keyboard, screen and so on.'},
 {t:'RAM',d:'Random Access Memory. Fast temporary memory that holds the programs and data being used right now.'},
 {t:'Kernel Mode',d:'A privileged CPU mode in which code can use all hardware and memory. Used by the OS core and drivers.'},
 {t:'User Mode',d:'A restricted CPU mode in which applications run. They must use system calls to reach hardware.'},
 {t:'Time Slice',d:'A very short period of CPU time given to one process before the scheduler gives it to another. Also called a quantum.'},
 {t:'Distributed OS',d:'An OS that controls many networked computers and makes them look like a single system.'},
 {t:'Embedded OS',d:'A small OS built into a dedicated device such as a TV, router or washing machine.'}
];
const TIPS_EXTRA=[
 {t:'Latency',d:'The delay between a request and the start of the response.'},
 {t:'Throughput',d:'The amount of work completed in a given time.'}
];
const FLASH=[
 {q:'What is an Operating System?',a:'System software that acts as an interface between the user/applications and the computer hardware, and manages resources.'},
 {q:'Name the six fundamental goals of an OS.',a:'Convenience, efficiency, resource management, security and protection, reliability, and ability to evolve.'},
 {q:'List the OS services.',a:'Program execution, I/O operations, file-system manipulation, communication, error detection, resource allocation, protection and security, accounting.'},
 {q:'What is multiprogramming?',a:'Keeping several programs in memory so the CPU switches to another program when one waits for I/O. Goal: higher CPU utilization.'},
 {q:'What is a time-sharing OS?',a:'An OS that divides CPU time into small time slices so many users get quick, interactive responses.'},
 {q:'What is a real-time OS?',a:'An OS that must respond within a defined time limit. Hard: deadline must be met. Soft: occasional delay is acceptable.'},
 {q:'What is a multithreading OS?',a:'An OS in which one process can contain several threads that share memory and run concurrently.'},
 {q:'What is a distributed OS?',a:'An OS that manages many networked computers and makes them appear as one system. Gives resource sharing, load balancing and fault tolerance.'},
 {q:'What is an embedded OS?',a:'A small OS built for one dedicated device, such as a smart TV, router, ATM or washing machine.'},
 {q:'What is a layered OS?',a:'An OS built as a stack of layers; each layer uses only the services of the layer below. Easy to debug but has overhead.'},
 {q:'What is a monolithic OS?',a:'An OS where all main services run inside one large kernel. Very fast, but a kernel failure can affect everything. Example: Linux.'},
 {q:'What is a microkernel?',a:'A minimal kernel (IPC, scheduling, basic memory). Other services run in user space. More reliable, with message-passing overhead.'},
 {q:'What is Linux?',a:'A free, open-source, UNIX-like OS. Linux is the kernel (by Linus Torvalds, 1991); with GNU tools it forms a full system. Monolithic and modular.'},
 {q:'What is Windows\' architecture in short?',a:'Built on the NT kernel (hybrid). User mode (apps, services) is separated from kernel mode (Executive, kernel, drivers, HAL).'},
 {q:'What is macOS built on?',a:'Darwin, an open-source UNIX-based core, with the XNU hybrid kernel made of Mach, BSD and I/O Kit.'}
];

(function(){
