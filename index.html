  add('Which statement best describes an operating system?','System software that acts as an interface between users/applications and hardware',['A program that only edits documents','A physical part of the CPU','A type of computer network'],'An OS is system software that sits between applications and hardware and manages resources.');
  add('Which of these is NOT a fundamental goal of an operating system?','Making hardware more expensive',['Convenience','Efficiency','Reliability'],'The six goals are convenience, efficiency, resource management, security, reliability and ability to evolve.');
  add('Which OS service loads a program into memory and starts it?','Program execution',['Accounting','Error detection','File-system manipulation'],'Program execution loads the program, starts it and handles its termination.');
  add('When you press Print, which service lets the program use the printer?','I/O operations',['Accounting','Communication','Protection'],'Programs cannot control devices directly; the OS performs I/O through device drivers.');
  add('Which OS service keeps records of how much CPU time each user has used?','Accounting',['Program execution','Error detection','Communication'],'Accounting tracks resource use by users and programs.');
  add('What is the purpose of a system call?','To let a program request a service from the kernel',['To format the hard disk','To increase the CPU speed','To connect to a telephone'],'A system call is the controlled way a user program asks the kernel for a service.');
  add('What is the main aim of a multiprogramming OS?','Keep the CPU busy by switching programs when one waits for I/O',['Give every user exactly one minute of CPU time','Respond to events within a deadline','Join many computers into one system'],'Multiprogramming improves CPU utilization by always having another ready program.');
  add('A very short period of CPU time given to a process in a time-sharing system is called a:','Time slice (quantum)',['Deadline','Thread','Page'],'The time slice or quantum is the fixed short time each process gets before the scheduler switches.');
  add('Saving the state of one process and loading the state of another is called:','Context switching',['Booting','Paging','Compiling'],'A context switch saves and restores process state so the CPU can change tasks.');
  add('What is the main benefit of a time-sharing OS?','Quick, interactive response for many users',['Guaranteed deadlines for every task','No need for a scheduler','Lower memory use than any other OS'],'Small time slices make each user feel the computer is responding just for them.');
  add('Which is an example of a hard real-time system?','A car airbag controller',['A video call','A music player','A word processor'],'If an airbag fires late, the failure is serious. That is hard real-time.');
  add('Which is an example of a soft real-time system?','Streaming video',['A pacemaker','An aircraft flight controller','An industrial robot arm safety stop'],'A late video frame lowers quality but does not cause a disaster.');
  add('"Real-time" in an RTOS mainly means:','Responding within a guaranteed time limit',['Running the fastest CPU available','Showing the real clock time on the screen','Using no memory'],'Real-time is about predictable, deadline-bound response, not just speed.');
  add('Threads belonging to the same process share:','Code, data and open files',['Their stacks and registers','Nothing at all','Only the CPU registers'],'Threads share the process memory and resources, but each has its own stack and registers.');
  add('Compared with creating a process, creating a thread is generally:','Cheaper and faster',['More expensive and slower','Impossible in modern systems','Exactly the same cost'],'Threads are lightweight because they share the process address space.');
  add('A distributed operating system makes many networked computers appear as:','One single system',['Many unrelated systems','A single CPU only','A printer'],'The user sees one system even though several computers do the work.');
  add('Fault tolerance in a distributed OS means:','The system keeps working if one machine fails',['Every machine must have the same CPU','Errors are never possible','All users share one password'],'Work can be moved to other machines when one fails.');
  add('Which device most likely uses an embedded operating system?','A washing machine controller',['A cloud server farm','A graphics workstation with 64 GB RAM','A supercomputer cluster'],'Embedded OSs are small systems built into dedicated devices.');
  add('In a layered operating system, each layer uses the services of:','The layer directly below it',['Any layer above it','Only the hardware directly','No other layer'],'Each layer is built on lower layers and offers services to higher layers.');
  add('A disadvantage of the layered structure is:','Performance overhead because requests pass through many layers',['It cannot be tested','It has no hardware layer','It always crashes the whole system'],'Each layer adds a little delay, and defining the layers can be difficult.');
  add('In a monolithic OS:','All major services run inside one large kernel',['Only IPC and scheduling run in the kernel','Every service runs in its own computer','There is no kernel'],'Monolithic kernels put process, memory, file, driver and network code together in kernel space.');
  add('Which description fits the Linux kernel?','Monolithic with loadable modules',['A pure microkernel','A layered kernel with exactly six layers','An embedded-only kernel'],'Linux is monolithic, but modules can be loaded and unloaded at run time.');
  add('Which services stay inside a microkernel?','IPC, CPU scheduling and basic memory management',['File system, drivers and networking','Only the web browser','All applications'],'Only the most essential services stay in the microkernel.');
  add('A main disadvantage of a microkernel is:','Message-passing (communication) overhead',['It has no memory management','It cannot run drivers at all','It needs no hardware'],'Services communicate by messages, which costs extra time and context switches.');
  add('If a user-space disk driver crashes in a microkernel system, what usually happens?','Only that server fails and it can be restarted',['The whole computer always crashes','All files are deleted','The kernel is replaced'],'User-space servers are isolated from the kernel.');
  add('Who started the Linux kernel in 1991?','Linus Torvalds',['Bill Gates','Steve Jobs','Dennis Ritchie'],'Linus Torvalds created the Linux kernel in 1991.');
  add('In the Linux file system, the top of the directory tree is called:','The root directory, written /',['The C: drive','The desktop','The registry'],'Linux has one tree starting at / with no drive letters.');
  add('Which Linux command lists the files in a folder?','ls',['pwd','mkdir','top'],'ls lists files and folders. pwd shows the current folder.');
  add('Which Linux command shows the current working directory?','pwd',['cat','cp','ps'],'pwd means "print working directory".');
  add('Modern Windows is built on which kernel?','The Windows NT kernel',['The Linux kernel','The XNU kernel','The MINIX kernel'],'Windows 11 and Windows Server are based on the NT kernel.');
  add('In Windows, device drivers and the HAL run in:','Kernel mode',['User mode','Safe mode only','No particular mode'],'Drivers and the HAL are part of kernel mode, so a faulty driver can crash Windows.');
  add('The XNU kernel of macOS combines:','Mach, BSD and I/O Kit',['Linux, GNU and X11','NT, Win32 and HAL','MINIX, QNX and L4'],'XNU = Mach + BSD + I/O Kit.');
  add('What is the default file system on modern Macs?','APFS',['NTFS','ext4','FAT12'],'Apple File System (APFS) is the default on current macOS.');
  add('Darwin is best described as:','The open-source UNIX-based core of macOS',['A Linux distribution','The macOS desktop theme','A Windows service'],'Darwin includes the XNU kernel and BSD tools and is open source.');
  add('Which statement about comparing Linux, Windows and macOS is most accurate?','Which is suitable depends on the requirements of the user',['One of them is best for every purpose','Only Linux has a kernel','Only macOS has security features'],'Each has strengths; the right choice depends on software, hardware, cost and skills.');

  ${card('Hard Real-Time vs Soft Real-Time',['Point','Hard real-time','Soft real-time'],[['Deadline','Must always be met','Important, but a miss is tolerated'],['Result of missing it','Failure or danger','Lower quality'],['Examples','Airbag, pacemaker, flight control','Video streaming, online games'],['Design cost','Very high','Moderate']])}
  ${card('Monolithic vs Microkernel',['Point','Monolithic kernel','Microkernel'],[['Kernel size','Large','Very small'],['Speed','Faster (direct calls)','Slower (messages)'],['Reliability','A kernel bug can crash everything','Failure of a server is contained'],['Drivers run in','Kernel mode','User space'],['Example','Linux','MINIX 3, QNX']])}
  ${card('User Mode vs Kernel Mode',['Point','User mode','Kernel mode'],[['Used by','Applications','OS core and drivers'],['Hardware access','Not allowed directly','Full'],['Crash effect','One program stops','Whole system may stop'],['How to enter OS','System call','Already inside']])}
  ${card('Linux vs Windows vs macOS',['Point','Linux','Windows','macOS'],[['Kernel','Linux (monolithic, modular)','NT (hybrid)','XNU (hybrid)'],['Licence','Open source','Proprietary','Proprietary'],['Common strength','Servers and flexibility','Software and games range','Hardware integration'],['Default file system','ext4 (many distros)','NTFS','APFS']])}
  </div>
  <div class="callout" style="margin-top:1rem"><span class="lab">Remember</span><p>The last comparison is not a ranking. Each system fits different needs.</p></div>`;
}});
CH.push({id:'glossary',title:'Glossary',short:'Glossary',render(){
  return `${chHead('Chapter 16','Glossary','Simple meanings of the key terms. Type to search.')}${widget('glossary','gl')}`;
}});
const OUTCOMES=['Define Operating System.','Explain fundamental OS goals.','Explain OS services.','Differentiate major OS types.','Explain Layered, Monolithic and Microkernel structures.','Describe Linux architecture.','Describe Windows architecture.','Describe macOS architecture.','Compare different OS architectures.','Explain OS concepts using real-world examples.'];
CH.push({id:'summary',title:'Final Learning Summary',short:'Final Summary',render(){
  const done=store.get('outcomes',[]);
  return `${chHead('Chapter 17','Final Learning Summary','After completing this module, students should be able to:')}
  <div class="card"><ol style="list-style:none;margin:0;padding:0;display:grid;gap:.6rem">${OUTCOMES.map((o,i)=>`<li><label style="display:flex;gap:.7rem;align-items:flex-start;font-size:1.1rem"><input type="checkbox" data-o="${i}" ${done.includes(i)?'checked':''} style="width:1.3rem;height:1.3rem;margin-top:.2rem;accent-color:var(--h6)"><span>${o}</span></label></li>`).join('')}</ol><p class="chip" id="oc" style="margin-top:1rem"></p></div>
  <div class="grid3" style="margin-top:1rem"><div class="callout"><span class="lab">Remember</span><p>An OS is the manager between users, programs and hardware.</p></div><div class="callout comp"><span class="lab">Remember</span><p>Types describe how the OS runs programs. Structures describe how the OS is built.</p></div><div class="callout real"><span class="lab">Remember</span><p>Linux, Windows and macOS each make different design choices for different needs.</p></div></div>
  <div class="row" style="margin-top:1.2rem"><button class="btn" data-go="quiz">Take the quiz again</button><button class="btn ghost" data-go="cards">Revise with flash cards</button><button class="btn ghost" data-go="intro">Back to start</button></div>`;
}});

/* ========== app logic ========== */
const main=$('#main'),toc=$('#toc');
let curIdx=0,printing=false;
const seen=new Set(store.get('seen',[]));
const TEXTX={cards:()=>FLASH.map(f=>f.q+' '+f.a).join(' '),quiz:()=>QUIZ.map(q=>q.q+' '+q.o.join(' ')+' '+q.e).join(' '),glossary:()=>GLOSSARY.map(g=>g.t+' '+g.d).join(' ')};
toc.innerHTML=CH.map((c,i)=>`<li data-id="${c.id}"><button data-id="${c.id}"><span class="n">${i+1}</span><span>${c.short}</span></button></li>`).join('');
function initWidgets(root){$$('[data-widget]',root).forEach(el=>{try{WIDGETS[el.dataset.widget]?.(el)}catch(e){console.error('widget',el.dataset.widget,e)}})}
function navHtml(i){
  const p=CH[i-1],n=CH[i+1];
  return `<nav class="chnav" aria-label="Chapter navigation">${p?`<button data-go="${p.id}" class="prev"><small>← Previous</small><b>${p.title}</b></button>`:'<span></span>'}${n?`<button data-go="${n.id}" class="next"><small>Next →</small><b>${n.title}</b></button>`:''}</nav>`;
}
function updateProgress(){
  const n=CH.length,s=seen.size,pct=Math.round(100*s/n);
  $('#pbar').style.width=pct+'%';$('#pbarWrap').setAttribute('aria-valuenow',pct);
  $('#ptxt').textContent=`${s} of ${n} chapters (${pct}%)`;
  $$('#toc li').forEach(li=>li.classList.toggle('seen',seen.has(li.dataset.id)));
}
function show(id,anchor,quiet){
  const i=CH.findIndex(c=>c.id===id);if(i<0)return;
  curIdx=i;const c=CH[i];
  main.innerHTML=`<article class="chapter" id="ch-${c.id}" aria-label="${esc(c.title)}">${tipify(c.render())}${navHtml(i)}</article>`;
  initWidgets(main);
  $$('#toc button').forEach(b=>b.removeAttribute('aria-current'));
  $(`#toc button[data-id="${id}"]`).setAttribute('aria-current','page');
  seen.add(id);store.set('seen',[...seen]);updateProgress();
  try{history.replaceState(null,'','#'+id)}catch(e){}
  document.title='OS Fundamentals · '+c.short;
  closeMenu();
  if(!quiet){
    const t=anchor&&document.getElementById(anchor);
    if(t){setTimeout(()=>t.scrollIntoView({behavior:'smooth',block:'start'}),60)}
    else window.scrollTo({top:0,behavior:'instant'in window?'instant':'auto'});
    if(!t)main.focus({preventScroll:true});
  }
  const o=$('#oc');if(o){const upd=()=>{const d=$$('[data-o]',main).filter(x=>x.checked).length;o.textContent=`${d} of ${OUTCOMES.length} outcomes ticked`;store.set('outcomes',$$('[data-o]',main).map((x,k)=>x.checked?k:-1).filter(k=>k>=0))};main.addEventListener('change',e=>{if(e.target.matches('[data-o]'))upd()});upd()}
}
function go(ch,an){show(ch,an||null)}

/* menu */
function closeMenu(){$('#side').classList.remove('open');$('#scrim').classList.remove('open');$('#menuBtn').setAttribute('aria-expanded','false')}
$('#menuBtn').addEventListener('click',()=>{const o=$('#side').classList.toggle('open');$('#scrim').classList.toggle('open',o);$('#menuBtn').setAttribute('aria-expanded',o)});
$('#scrim').addEventListener('click',closeMenu);
toc.addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(b)show(b.dataset.id)});
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g&&!g.closest('#toc')){e.preventDefault();show(g.dataset.go,g.dataset.an||null)}
});

/* theme and font size */
const root=document.documentElement;
function effTheme(){return root.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
const savedTheme=store.get('theme',null);if(savedTheme)root.dataset.theme=savedTheme;
$('#themeBtn').addEventListener('click',()=>{const t=effTheme()==='dark'?'light':'dark';root.dataset.theme=t;store.set('theme',t)});
let fs=store.get('fs',1);const setFs=v=>{fs=Math.min(1.6,Math.max(.85,Math.round(v*100)/100));root.style.setProperty('--fs',fs);store.set('fs',fs)};setFs(fs);
$('#fsUp').addEventListener('click',()=>setFs(fs+.1));$('#fsDown').addEventListener('click',()=>setFs(fs-.1));

/* back to top */
const toTop=$('#toTop');
addEventListener('scroll',()=>toTop.classList.toggle('show',scrollY>600),{passive:true});
toTop.addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));

/* tooltips */
const tipbox=$('#tipbox');
function showTip(t){
  tipbox.textContent=t.dataset.tip;tipbox.hidden=false;
  const r=t.getBoundingClientRect(),b=tipbox.getBoundingClientRect();
  let x=r.left+r.width/2-b.width/2;x=Math.max(8,Math.min(x,innerWidth-b.width-8));
  let y=r.bottom+8;if(y+b.height>innerHeight-8)y=r.top-b.height-8;
  tipbox.style.left=x+'px';tipbox.style.top=Math.max(8,y)+'px';
}
document.addEventListener('mouseover',e=>{const t=e.target.closest?.('.tip');if(t)showTip(t)});
document.addEventListener('mouseout',e=>{if(e.target.closest?.('.tip'))tipbox.hidden=true});
document.addEventListener('focusin',e=>{const t=e.target.closest?.('.tip');if(t)showTip(t)});
document.addEventListener('focusout',e=>{if(e.target.closest?.('.tip'))tipbox.hidden=true});
document.addEventListener('click',e=>{const t=e.target.closest?.('.tip');if(t)showTip(t);else tipbox.hidden=true});

/* search */
let INDEX=null;
function buildIndex(){
  INDEX=CH.map(c=>{
    const d=document.createElement('div');d.innerHTML=tipify(c.render());
    let t=d.textContent.replace(/\s+/g,' ');if(TEXTX[c.id])t+=' '+TEXTX[c.id]();
    return {c,t,l:t.toLowerCase()};
  });
}
const qIn=$('#q'),resBox=$('#results');let qTimer;
function doSearch(){
  const q=qIn.value.trim().toLowerCase();
  if(q.length<2){resBox.hidden=true;return}
  if(!INDEX)buildIndex();
  const terms=q.split(/\s+/);
  const hits=INDEX.filter(x=>terms.every(t=>x.l.includes(t)));
  resBox.innerHTML=hits.length?hits.slice(0,12).map(h=>{
    const p=h.l.indexOf(terms[0]),s=h.t.slice(Math.max(0,p-50),p+90);
    return `<button role="option" data-id="${h.c.id}"><b>${h.c.title}</b><span>…${esc(s)}…</span></button>`;
  }).join(''):'<p style="padding:.6rem .8rem;margin:0">No topic matches. Try a shorter word.</p>';
  resBox.hidden=false;
}
qIn.addEventListener('input',()=>{clearTimeout(qTimer);qTimer=setTimeout(doSearch,150)});
resBox.addEventListener('click',e=>{
  const b=e.target.closest('button[data-id]');if(!b)return;
  const q=qIn.value.trim();show(b.dataset.id);resBox.hidden=true;setTimeout(()=>highlight(q),120);
});
function highlight(q){
  const term=q.toLowerCase().split(/\s+/)[0];if(!term)return;
  const w=document.createTreeWalker(main,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('script,style,svg,button,.term')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const hits=[];let n;while(n=w.nextNode()){if(n.nodeValue.toLowerCase().includes(term))hits.push(n);if(hits.length>40)break}
  let first=null;
  hits.forEach(n=>{
    const v=n.nodeValue,l=v.toLowerCase(),i=l.indexOf(term);if(i<0)return;
    const m=document.createElement('mark');m.textContent=v.slice(i,i+term.length);
    const after=n.splitText(i);after.nodeValue=after.nodeValue.slice(term.length);
    n.parentNode.insertBefore(m,after);if(!first)first=m;
    const d=n.parentElement.closest('details');if(d)d.open=true;
  });
  if(first)first.scrollIntoView({block:'center',behavior:'smooth'});
}
document.addEventListener('click',e=>{if(!e.target.closest('.search'))resBox.hidden=true});

/* keyboard */
document.addEventListener('keydown',e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable;
  if(e.key==='Escape'){resBox.hidden=true;closeMenu();tipbox.hidden=true;return}
  if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='/'){e.preventDefault();qIn.focus();return}
  if(e.key==='ArrowRight'&&curIdx<CH.length-1)show(CH[curIdx+1].id);
  if(e.key==='ArrowLeft'&&curIdx>0)show(CH[curIdx-1].id);
});

/* print: render every chapter */
addEventListener('beforeprint',()=>{
  printing=true;
  main.innerHTML=CH.map(c=>`<article class="chapter">${tipify(c.render())}</article>`).join('');
  initWidgets(main);$$('details',main).forEach(d=>d.open=true);
});
addEventListener('afterprint',()=>{if(printing){printing=false;show(CH[curIdx].id,null,true)}});

/* start */
(function(){
  const h=location.hash.slice(1);
  show(CH.some(c=>c.id===h)?h:'intro',null,true);
  addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(CH.some(c=>c.id===h)&&CH[curIdx].id!==h)show(h)});
})();
</script>

</body></html>
